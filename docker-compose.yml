name: n8n

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Chihuahua
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  n8n:
    image: docker.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://localhost:5678/
      # Borra de verdad cada minuto las ejecuciones que no se guardan (receptor de Signal)
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: 1
      GENERIC_TIMEZONE: America/Chihuahua
      TZ: America/Chihuahua
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  signal-api:
    image: docker.io/bbernhard/signal-cli-rest-api:latest
    container_name: n8n-signal-api
    restart: unless-stopped
    environment:
      MODE: json-rpc
      TZ: America/Chihuahua
    # Solo en localhost: para vincular el número (QR) y para el servicio de control
    # (control/signal-control.py), que lee los mensajes por websocket.
    # n8n llega a este servicio por la red interna en http://signal-api:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - signal_data:/home/.local/share/signal-cli

volumes:
  postgres17_data:
  n8n_data:
  signal_data:
